services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - S3_BUCKET=${S3_BUCKET:-pushkit-dev}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - API_KEYS=${API_KEYS:-dev-key-1:user1,dev-key-2:user2}
      - DATABASE_URL=${DATABASE_URL:-/data/pushkit.db}
      - LISTEN_ADDR=${LISTEN_ADDR:-:8000}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2 &&
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb local/${S3_BUCKET:-pushkit-dev} --ignore-existing
      "

volumes:
  api-data:
