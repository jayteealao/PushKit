# Release pipeline
#
# OPERATOR RECOVERY NOTE (M-19):
# If publish-pypi succeeds but create-github-release fails, a PyPI package
# exists with no matching GitHub Release.  Recovery options:
#   1. Yank the PyPI release:  pip install twine && twine package yank pushkit <version>
#      (requires PyPI API token with yank scope)
#   2. Fix the underlying cause, then re-tag as <version>-rc.N+1 (or the next
#      patch/minor) and push the new tag to trigger a clean pipeline run.
# The failed run will also emit a ::error:: annotation with this guidance.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tag-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from main
        run: |
          git fetch origin main --depth=0 || git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not reachable from origin/main. Release aborted."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME confirmed on main."

  # M-15: Single source for the version strip. All downstream jobs consume
  # needs.version.outputs.version (vX.Y.Z) or needs.version.outputs.stripped
  # (X.Y.Z without the leading v) rather than re-stripping inline.
  version:
    needs: [tag-guard]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      stripped: ${{ steps.ver.outputs.stripped }}
      pep440: ${{ steps.ver.outputs.pep440 }}
    steps:
      - name: Compute version outputs
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          STRIPPED="${REF_NAME#v}"
          # PEP 440 normalization for the Python wheel only: -rc.N -> rcN, -alpha.N -> aN, -beta.N -> bN.
          # Wheel filenames use '-' as a field separator, so the prerelease suffix must contain no '-' or '.'.
          PEP440="$(printf '%s' "$STRIPPED" | sed -E 's/-rc\.([0-9]+)$/rc\1/; s/-alpha\.([0-9]+)$/a\1/; s/-beta\.([0-9]+)$/b\1/')"
          echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "stripped=${STRIPPED}" >> "$GITHUB_OUTPUT"
          echo "pep440=${PEP440}" >> "$GITHUB_OUTPUT"

  retest-backend:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Go tests
        uses: ./.github/actions/go-test
        with:
          module: backend

  retest-cli:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Go tests
        uses: ./.github/actions/go-test
        with:
          module: cli

  retest-android:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and lint
        run: ./gradlew assembleDebug lint testDebugUnitTest
        working-directory: android

  build-cli-wheel:
    needs: [version, retest-backend, retest-cli, retest-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.11"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build wheel
        # M-15: version consumed from the canonical version job output.
        # M-18: value moved into env block; shell references $PEP440 not an expression.
        # Python wheels require the PEP 440-normalized version (e.g. 0.1.0rc1), not the
        # tag's -rc.N form, or PyPI rejects the wheel filename.
        env:
          PEP440: ${{ needs.version.outputs.pep440 }}
        run: make build-wheels VERSION="$PEP440"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-wheel
          path: dist/*.whl
          retention-days: 7
          if-no-files-found: error

  build-backend-binary:
    needs: [version, retest-backend, retest-cli, retest-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.11"

      - name: Install mingw-w64 cross-compiler
        run: sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cross-compile pushkit-server.exe
        # M-15 + M-18: version from canonical job; injected via env, not expression interpolation.
        # CGO_ENABLED=1 with mingw-w64: required for mattn/go-sqlite3 (cgo driver).
        # -extldflags "-static": links libgcc/libwinpthread statically; binary requires only system DLLs.
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          STRIPPED: ${{ needs.version.outputs.stripped }}
        run: |
          go build \
            -ldflags "-X main.Version=$STRIPPED -extldflags \"-static\"" \
            -o pushkit-server.exe \
            ./cmd/server
        working-directory: backend

      - name: Verify no unexpected DLL dependencies
        run: |
          x86_64-w64-mingw32-objdump -p backend/pushkit-server.exe \
            | grep "DLL Name:" \
            | grep -Eiv "KERNEL32|ntdll|ADVAPI32|WS2_32|msvcrt|SHELL32|USER32|ole32" \
            && { echo "Unexpected DLL dependency found"; exit 1; } || true

      - name: Upload backend binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-windows-binary
          path: backend/pushkit-server.exe
          retention-days: 7
          if-no-files-found: error

  build-backend-installer:
    needs: [version, build-backend-binary]
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download backend binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-windows-binary
          path: backend/

      - name: Install NSIS 3.12
        uses: repolevedavaj/install-nsis@c14d0ea1b829818b4e9313d8e009b43f0a65fddd # v1.2.0
        with:
          nsis-version: "3.12"

      - name: Verify SimpleSC.dll integrity
        shell: pwsh
        run: |
          $expected = "1620CDF739F459D1D83411F93648F29DCF947A910CC761E85AC79A69639D127D"
          $actual = (Get-FileHash backend/installer/plugins/SimpleSC.dll -Algorithm SHA256).Hash
          if ($actual -ine $expected) { Write-Error "SimpleSC.dll hash mismatch: got $actual, expected $expected"; exit 1 }

      - name: Run makensis
        # M-15 + M-18: version from canonical job; injected via env, not expression interpolation.
        shell: cmd
        env:
          STRIPPED: ${{ needs.version.outputs.stripped }}
        run: makensis /V3 /DVERSION=%STRIPPED% backend\installer\pushkit.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: backend/installer/pushkit-server-setup.exe
          retention-days: 7
          if-no-files-found: error

  build-android-apk:
    needs: [version, retest-backend, retest-cli, retest-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compute version overrides
        id: overrides
        # M-15 + M-18: VERSION_NAME from canonical job; injected via env, not expression interpolation.
        env:
          STRIPPED: ${{ needs.version.outputs.stripped }}
        run: |
          VERSION_CODE=$(git rev-list --first-parent --count HEAD)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$STRIPPED" >> "$GITHUB_OUTPUT"

      - name: Build APK
        # M-18: step output values injected via env block.
        env:
          VERSION_CODE: ${{ steps.overrides.outputs.VERSION_CODE }}
          VERSION_NAME: ${{ steps.overrides.outputs.VERSION_NAME }}
        run: |
          ./gradlew assembleDebug \
            -PversionCodeOverride="$VERSION_CODE" \
            -PversionNameOverride="$VERSION_NAME"
        working-directory: android

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pushkit-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: pushkit-android.apk
          retention-days: 7
          if-no-files-found: error

  generate-changelog:
    needs: [version, retest-backend, retest-cli, retest-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Run git-cliff
        # M-18: github.ref_name injected via env block.
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        env:
          REF_NAME: ${{ github.ref_name }}
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ github.ref_name }} -o CHANGELOG-${{ github.ref_name }}.md

      - name: Upload changelog artifact
        # M-18: github.ref_name in with: is not a run: block, no injection risk; kept as-is.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: changelog
          path: CHANGELOG-${{ github.ref_name }}.md
          retention-days: 7
          if-no-files-found: error

  publish-pypi:
    needs:
      - build-cli-wheel
      - build-backend-installer
      - build-android-apk
      - generate-changelog
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-wheel
          path: dist/

      - name: Publish to PyPI
        # M-12: attestations enabled (PEP 740 / Sigstore provenance).
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/
          attestations: true

  create-github-release:
    needs:
      - version
      - publish-pypi
      - build-backend-installer
      - build-android-apk
      - generate-changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download windows-installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: release-assets/
          merge-multiple: true

      - name: Download android-apk artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-apk
          path: release-assets/
          merge-multiple: true

      - name: Download changelog artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: changelog
          path: release-assets/
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: |
          sha256sum pushkit-server-setup.exe pushkit-android.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Determine prerelease flag
        id: prerelease
        # M-07: regex anchored so -(rc|alpha|beta) only matches a PEP-440-style
        # prerelease SUFFIX (e.g. v1.2.3-rc.1) and not mid-tag occurrences
        # like v1.0.0-backport-rc-fix.
        # M-18: GITHUB_REF_NAME is an env var set by the runner, not an expression
        # interpolated into the script, so no injection risk here; left as-is.
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ -(rc|alpha|beta)(\.[0-9]+)?$ ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        # M-18: github.ref_name appears in with: (not run:), no injection risk.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-assets/CHANGELOG-${{ github.ref_name }}.md
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
          make_latest: ${{ steps.prerelease.outputs.IS_PRERELEASE == 'false' }}
          fail_on_unmatched_files: true
          files: |
            release-assets/pushkit-server-setup.exe
            release-assets/pushkit-android.apk
            release-assets/SHA256SUMS

      # M-19: If this job reaches this step, the GitHub Release creation above
      # succeeded. The step below only fires on failure of any *prior* step in
      # this job (e.g. SHA256SUMS generation, artifact download) while
      # publish-pypi already succeeded — giving operators clear guidance.
      - name: Recovery guidance on failure
        if: failure()
        run: |
          echo "::error::create-github-release failed AFTER publish-pypi succeeded."
          echo "::error::A PyPI package was published but no GitHub Release exists."
          echo "::error::Recovery options:"
          echo "::error::  1. Yank the PyPI release: pip install twine && twine package yank pushkit ${GITHUB_REF_NAME#v}"
          echo "::error::     (requires a PyPI API token with the yank scope)"
          echo "::error::  2. Fix the root cause, then re-tag as the next pre-release (e.g. ${GITHUB_REF_NAME}-rc.1 or a new patch/minor)"
          echo "::error::     and push the new tag to trigger a clean pipeline run."

  post-publish-linux:
    needs: [version, create-github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compute PEP 440 normalized version
        id: normalize
        # M-15 + M-18: stripped version from canonical version job; injected via env.
        env:
          STRIPPED: ${{ needs.version.outputs.stripped }}
        run: |
          python -m pip install --quiet packaging
          VERSION_PEP440=$(python -c 'import os; from packaging.version import Version; print(str(Version(os.environ["STRIPPED"])))')
          if [[ -z "$VERSION_PEP440" ]]; then
            echo "::error::PEP 440 version normalization produced an empty string"
            exit 1
          fi
          echo "VERSION_PEP440=$VERSION_PEP440" >> "$GITHUB_OUTPUT"

      - name: Fresh resolve from PyPI (AC6)
        # M-18: step output injected via env block.
        env:
          VERSION_PEP440: ${{ steps.normalize.outputs.VERSION_PEP440 }}
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install --no-cache-dir --pre "pushkit==$VERSION_PEP440"
          /tmp/venv/bin/pushkit --version

      - name: Assert GitHub Release assets (AC5 automated portion)
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '.assets[].name' | sort > actual-assets.txt
          printf 'SHA256SUMS\npushkit-android.apk\npushkit-server-setup.exe\n' | sort > expected-assets.txt
          diff actual-assets.txt expected-assets.txt

      - name: Download release assets
        run: |
          mkdir -p post-publish-assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "pushkit-android.apk" \
            --pattern "pushkit-server-setup.exe" \
            --pattern "SHA256SUMS" \
            --dir post-publish-assets

      - name: APK version probe (AC8)
        # M-15 + M-18: EXPECTED_NAME from canonical version job; injected via env.
        env:
          EXPECTED_NAME: ${{ needs.version.outputs.stripped }}
        run: |
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt -type f 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "${AAPT}" || ! -x "${AAPT}" ]]; then
            echo "::error::aapt not found under ANDROID_HOME build-tools"
            exit 1
          fi
          echo "Using aapt at: ${AAPT}"
          BADGING=$("${AAPT}" dump badging post-publish-assets/pushkit-android.apk)
          echo "${BADGING}" | grep -E "versionCode|versionName"

          if ! echo "${BADGING}" | grep -q "versionName='${EXPECTED_NAME}'"; then
            echo "::error::APK versionName mismatch (expected ${EXPECTED_NAME})"
            exit 1
          fi
          if ! echo "${BADGING}" | grep -qE "versionCode='[0-9]+'"; then
            echo "::error::APK versionCode missing or non-numeric"
            exit 1
          fi

      - name: Verify SHA256SUMS (AC10)
        working-directory: post-publish-assets
        run: sha256sum -c SHA256SUMS

  post-publish-windows:
    needs: [create-github-release]
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download installer from GitHub Release
        shell: pwsh
        run: |
          gh release download "${env:GITHUB_REF_NAME}" `
            --repo "${env:GITHUB_REPOSITORY}" `
            --pattern "pushkit-server-setup.exe" `
            --dir .

      - name: Silent install (AC7)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\pushkit-server-setup.exe" -ArgumentList "/S" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Error "Silent install failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }

      - name: Smoke-test --version (AC7 — version correctness)
        shell: pwsh
        run: |
          $exe = Join-Path $env:ProgramFiles "PushKit\pushkit-server.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "pushkit-server.exe not found at $exe"
            exit 1
          }
          $actual = (& $exe --version | Out-String).Trim()
          $expected = "pushkit-server $(${env:GITHUB_REF_NAME}.TrimStart('v'))"
          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"
          if ($actual -ne $expected) {
            Write-Error "Smoke-test mismatch"
            exit 1
          }

      - name: DB-open smoke-test (AC7 — detects CGO_ENABLED=0 stub)
        shell: pwsh
        env:
          DATABASE_URL: ${{ runner.temp }}\pushkit-smoke.db
        run: |
          $exe = Join-Path $env:ProgramFiles "PushKit\pushkit-server.exe"
          $result = (& $exe --db-check | Out-String).Trim()
          Write-Host "DB-check result: $result"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "DB-open smoke-test failed (exit $LASTEXITCODE) — binary may have been compiled without cgo"
            exit $LASTEXITCODE
          }
