name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a26af69be951a213d495a4c3e4e4022e16d87065 # v4

      - name: Run Go tests
        uses: ./.github/actions/go-test
        with:
          module: backend

  cli-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a26af69be951a213d495a4c3e4e4022e16d87065 # v4

      - name: Run Go tests
        uses: ./.github/actions/go-test
        with:
          module: cli

  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a26af69be951a213d495a4c3e4e4022e16d87065 # v4

      - name: Set up Java
        uses: actions/setup-java@40f1582b2485089dde7abd97c1529aa768e1baff # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and lint
        run: ./gradlew assembleDebug lint testDebugUnitTest
        working-directory: android

  # M-13: Go vulnerability scan gate — required pre-merge check.
  # govulncheck is fetched at the latest release; it is a Go tool with no
  # persistent side-effects so pinning the module path is sufficient.
  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a26af69be951a213d495a4c3e4e4022e16d87065 # v4

      - name: Set up Go
        uses: actions/setup-go@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5
        with:
          go-version: "1.24"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan backend
        run: govulncheck ./...
        working-directory: backend

      - name: Scan cli
        run: govulncheck ./...
        working-directory: cli

  commitlint-backstop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a26af69be951a213d495a4c3e4e4022e16d87065 # v4
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v6
        with:
          configFile: commitlint.config.cjs
