name: Go test
description: >
  Set up Go, run go vet and go test for a single module directory.
  Caller must have already run actions/checkout before invoking this action.

inputs:
  module:
    description: "Module subdirectory to test (e.g. backend or cli)"
    required: true

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: "1.25"

    - name: Vet
      shell: bash
      run: go vet ./...
      working-directory: ${{ inputs.module }}

    - name: Test
      shell: bash
      run: go test -race ./...
      working-directory: ${{ inputs.module }}
