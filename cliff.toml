# git-cliff configuration
# https://git-cliff.org/docs/configuration
#
# Render strategy: Keep-a-Changelog headings with Conventional Commits grouping.
# Non-conventional commits are dropped (filter_unconventional = true) so the
# v0.1.0-rc.1 changelog starts from the first conventional commit forward.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{%- endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = []
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^style", group = "<!-- 4 -->Styling" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^docs", group = "<!-- 6 -->Documentation" },
  { message = "^build", group = "<!-- 7 -->Build" },
  { message = "^ci", group = "<!-- 8 -->CI" },
  { message = "^chore", group = "<!-- 9 -->Miscellaneous Tasks" },
  { message = "^revert", group = "<!-- 10 -->Revert" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(?:-(?:rc|alpha|beta)\\.[0-9]+)?$"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
